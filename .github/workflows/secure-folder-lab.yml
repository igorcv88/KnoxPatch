name: Secure Folder DZIF LAB - signed APK artifact

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secure-folder-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secure-folder-lab:
    # Signing secrets are never made available to fork-based pull requests.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.head_ref, 'review/securefolder-dzif-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout experimental branch
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Verify isolated-source contracts
        run: python3 -m unittest discover -s tests -v

      - name: Configure private dependency credentials
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
        run: |
          set -euo pipefail
          for name in GPR_USER GPR_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub Packages secret is missing: $name" >&2
              exit 1
            fi
          done
          {
            printf 'gpr.user=%s\n' "$GPR_USER"
            printf 'gpr.key=%s\n' "$GPR_KEY"
          } >> gradle.properties

      - name: Prepare stable release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required release-signing secret is missing: $name" >&2
              exit 1
            fi
          done

          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > release.keystore
          chmod 600 release.keystore
          keytool -list -keystore release.keystore \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            printf 'releaseStoreFile=release.keystore\n'
            printf 'releaseStorePassword=%s\n' "$STORE_PASSWORD"
            printf 'releaseKeyAlias=%s\n' "$KEY_ALIAS"
            printf 'releaseKeyPassword=%s\n' "$KEY_PASSWORD"
          } >> gradle.properties

      - name: Build signed, non-debuggable Secure Folder companion
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --build-cache :app:assembleSepBasicSecureFolderRelease

      - name: Verify APK identity, signing and single-app hook scope
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          analyzer="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/apkanalyzer' -type f | sort | tail -n 1)"
          test -x "$analyzer"
          mapfile -t apks < <(find app/build/outputs/apk/sepBasicSecureFolder/release -maxdepth 1 -type f -name '*.apk')
          [[ "${#apks[@]}" == 1 ]]

          mkdir -p dist
          apk="dist/KnoxPatch-SecureFolder-DZIF-${GITHUB_SHA:0:7}.apk"
          cp "${apks[0]}" "$apk"
          "$build_tools/zipalign" -c -P 16 4 "$apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > "${apk}.cert.txt"

          expected_cert="$(keytool -exportcert -keystore release.keystore \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | awk '{print $1}')"
          # Compare the exact certificate digest regardless of how this version
          # of apksigner labels its signer lines. Its output contains only public
          # certificate metadata; private keys remain on the runner.
          if ! grep -Fqi "$expected_cert" "${apk}.cert.txt"; then
            echo "APK was not signed with the expected certificate SHA-256 $expected_cert" >&2
            sed -n '1,40p' "${apk}.cert.txt" >&2
            exit 1
          fi

          badging="$($build_tools/aapt dump badging "$apk" | sed -n '1p')"
          grep -F "package: name='io.mesalabs.knoxpatch.securefolderlab'" <<< "$badging"
          python3 tools/verify_apk_profile.py "$apk" SecureFolder \
            --aapt2 "$build_tools/aapt2" --apkanalyzer "$analyzer"
          sha256sum "$apk" > "${apk}.sha256"

      - name: Upload signed experimental APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnoxPatch-SecureFolder-DZIF-SIGNED-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f release.keystore
          sed -i '/^releaseStoreFile=/d;/^releaseStorePassword=/d;/^releaseKeyAlias=/d;/^releaseKeyPassword=/d;/^gpr.user=/d;/^gpr.key=/d' gradle.properties || true
