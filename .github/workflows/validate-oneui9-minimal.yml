name: Review One UI 9 KnoxPatch minimal scope
on:
  pull_request:
    paths:
      - 'app/src/main/java/io/mesalabs/knoxpatch/MainHook.kt'
      - 'app/src/main/res/values/arrays.xml'
      - 'app/src/main/res/values-v*/arrays.xml'
      - 'tests/test_oneui9_minimal_profile.py'
      - '.github/workflows/validate-oneui9-minimal.yml'
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/java/io/mesalabs/knoxpatch/MainHook.kt'
      - 'app/src/main/res/values/arrays.xml'
      - 'app/src/main/res/values-v*/arrays.xml'
      - 'tests/test_oneui9_minimal_profile.py'
      - '.github/workflows/validate-oneui9-minimal.yml'
permissions:
  contents: read
jobs:
  oneui9-minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate app-only One UI 9 hook profile and Xposed scope
        run: python3 -m unittest discover -s tests -p 'test_oneui9_minimal_profile.py' -v
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Configure private Gradle dependency repository
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
        run: |
          test -n "$GPR_USER"
          test -n "$GPR_KEY"
          {
            printf 'gpr.user=%s\n' "$GPR_USER"
            printf 'gpr.key=%s\n' "$GPR_KEY"
          } >> gradle.properties
      - name: Compile unsigned experimental release flavors
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache
