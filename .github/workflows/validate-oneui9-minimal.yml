name: Review KnoxPatch Full and Minimal profiles
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oneui9-minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate app-only One UI 9 hook profile and Xposed scope
        run: python3 -m unittest discover -s tests -v
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Configure private Gradle dependency repository
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
        run: |
          test -n "$GPR_USER"
          test -n "$GPR_KEY"
          {
            printf 'gpr.user=%s\n' "$GPR_USER"
            printf 'gpr.key=%s\n' "$GPR_KEY"
          } >> gradle.properties
      - name: Compile both sepBasic profiles (test signing only)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleSepBasicFullRelease :app:assembleSepBasicMinimalRelease --build-cache
      - name: Verify both compiled profiles independently
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          analyzer="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/apkanalyzer' -type f | sort | tail -n 1)"
          for profile in Full Minimal; do
            mapfile -t apks < <(find "app/build/outputs/apk/sepBasic${profile}/release" -maxdepth 1 -type f -name '*.apk')
            [[ "${#apks[@]}" == 1 ]]
            "$build_tools/apksigner" verify --verbose "${apks[0]}"
            python3 tools/verify_apk_profile.py "${apks[0]}" "$profile" --aapt2 "$build_tools/aapt2" --apkanalyzer "$analyzer"
            sha256sum "${apks[0]}" > "${apks[0]}.sha256"
          done
      - name: Upload review APKs (test certificate; not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: KnoxPatch-Full-Minimal-LAB-${{ github.sha }}
          path: |
            app/build/outputs/apk/sepBasicFull/release/*.apk*
            app/build/outputs/apk/sepBasicMinimal/release/*.apk*
          if-no-files-found: error
          retention-days: 14
